spring:
  application:
    name: ide-feedback-gateway

graph:
  base-url: https://graph.microsoft.com/v1.0
  tenant-id: ${GRAPH_TENANT_ID}
  cache-ttl: 5m
  cache-max-size: 10000
  connect-timeout: 3s
  read-timeout: 5s

moodle:
  base-url: ${MOODLE_BASE_URL}
  token: ${MOODLE_TOKEN}
  submit-run-function: mod_idetestfeedback_submit_test_run
  validation-error-prefix: validation_
